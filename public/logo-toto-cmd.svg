<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fond circulaire -->
  <circle cx="20" cy="20" r="18" fill="url(#logoGradient)" />

  <!-- Icône package/commande -->
  <g transform="translate(8, 8)" fill="white">
    <!-- Boîte principale -->
    <rect x="2" y="8" width="20" height="14" rx="2" stroke="white" stroke-width="1.5" fill="none"/>

    <!-- Couvercle -->
    <path d="M6 8l8-4 8 4v4l-8 4-8-4V8z" fill="white" opacity="0.8"/>

    <!-- Lignes de détail -->
    <line x1="2" y1="12" x2="22" y2="12" stroke="white" stroke-width="1" opacity="0.6"/>
    <line x1="2" y1="16" x2="22" y2="16" stroke="white" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Badge "T" pour Toto -->
  <circle cx="32" cy="12" r="6" fill="#ef4444" />
  <text x="32" y="16" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8" font-weight="bold">T</text>
</svg>
